name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ytlike.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ytlike-apk
          path: ytlike.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest ytlike.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "YT Like (build ${{ github.run_number }})" \
            --notes "Branch ${{ github.ref_name }}, commit ${{ github.sha }}"
